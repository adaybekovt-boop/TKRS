name: Materialize architecture batch 001

on:
  push:
    branches:
      - agent/architecture-batch-001-final
    paths:
      - 'batches/architecture-001/manifest.part-*.b64'
      - 'tools/materialize_architecture_batch.py'
      - '.github/workflows/materialize-architecture-001.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize and validate assets
        run: python tools/materialize_architecture_batch.py

      - name: Commit generated batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/architecture textures index batches/architecture-001/manifest.json SOURCES.md REPORT.md batch-manifest.json
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Add architecture asset batch 001 [skip ci]"
          git push origin HEAD:agent/architecture-batch-001-final

# Triggered after manifest upload.
